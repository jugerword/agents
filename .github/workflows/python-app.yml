# This workflow installs Python dependencies, runs the test suite and static
# analysis. The project is developed and tested on Python 3.11.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # pysha3 does not build on Python 3.11; poly_eip712_structs only needs
        # eip712-structs, so install it without deps (upstream known issue).
        pip install --no-deps eip712-structs==1.1.0 || true
    - name: Lint with ruff
      run: |
        ruff check agents scripts tests
    - name: Test with pytest
      env:
        PYTHONPATH: "."
      run: |
        python -m pytest tests/ -v
